        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cases_request.Cases_Request'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil memperbarui data kasus
          schema:
            additionalProperties: true
            type: object
        "404":
