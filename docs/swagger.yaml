  /api/detective/create:
    post:
      consumes:
      - application/json
      description: 'Endpoint ini melakukan proses pembuatan detektif baru, termasuk
        validasi data, transformasi input, dan penanganan error. Proses ini penting
        untuk memastikan integritas data personel investigasi. Asumsi: data valid,
        badge_number unik. Batasan: hanya admin dapat akses.'
      parameters:
      - description: "Payload detektif dalam format JSON.\n\nField 'investigation_style'
          hanya dapat bernilai salah satu dari: \n- 'Evidence-Based Investigation':
          Pendekatan investigasi yang menitikberatkan pada pengumpulan, analisis,
          dan interpretasi bukti fisik secara sistematis. Metode ini mengedepankan
          objektivitas dan validitas ilmiah dalam setiap tahapan investigasi. \n-
          'Interview-Based Investigation': Strategi investigasi yang berfokus pada
          teknik wawancara mendalam terhadap saksi, korban, dan tersangka. Pendekatan
          ini menuntut keterampilan komunikasi interpersonal dan analisis psikologis
          tingkat tinggi. \n- 'Undercover Investigation': Metode investigasi di mana
          detektif menyamar untuk memperoleh informasi yang tidak dapat diakses secara
          terbuka. Pendekatan ini sangat berisiko namun efektif dalam mengungkap kejahatan
          terorganisir. \n- 'Follow The Money Investigation': Investigasi yang memprioritaskan
          pelacakan aliran dana untuk mengidentifikasi motif, pelaku, dan jaringan
          kejahatan. Pendekatan ini sangat relevan dalam kasus korupsi dan kejahatan
          finansial. \n- 'Report-Based Investigation': Pendekatan yang mengandalkan
          analisis laporan, dokumen, dan data administratif sebagai sumber utama informasi.
          Cocok untuk kasus yang membutuhkan audit forensik dan penelusuran administratif
          secara mendalam."
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/detective_request.Detective_Request'
      produces:
      - application/json
      responses:
        "201":
          description: Detektif berhasil dibuat; response berisi data detektif baru
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Permintaan tidak valid; data input salah atau format tidak
            sesuai
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Terjadi kesalahan sistem internal
          schema:
            additionalProperties: true
            type: object
      summary: Membuat entitas detektif baru
      tags:
      - Detectives
  /api/detective/delete/{id}:
    delete:
      description: 'Endpoint ini menghapus data detektif berdasarkan ID. Proses ini
        tidak dapat dibatalkan dan berdampak pada assignment kasus terkait. Asumsi:
        ID valid dan eksis.'
      parameters:
      - description: UUID detektif yang akan dihapus
        in: path
        name: id
        required: true
        type: string
      produces:
