          kriminologi dan psikologi forensik, identifikasi gender ini penting untuk
          analisis pola perilaku, kecenderungan kriminal, serta pendekatan interogasi
          dan perlindungan hukum yang relevan. Gender laki-laki sering dikaitkan dengan
          karakteristik fisik dan psikososial tertentu yang dapat mempengaruhi jalannya
          investigasi.\n- 'Female': Menunjukkan jenis kelamin perempuan. Gender ini
          memiliki implikasi signifikan dalam proses investigasi, terutama terkait
          perlindungan saksi, pendekatan psikologis, dan sensitivitas terhadap isu
          gender-based violence. Penanganan tersangka atau saksi perempuan menuntut
          penerapan prinsip non-diskriminasi dan perlakuan khusus sesuai standar hak
          asasi manusia.\n\nField 'status' hanya dapat bernilai: \n- 'Arrested': Status
          ini menandakan bahwa tersangka telah resmi ditahan oleh aparat penegak hukum.
          Dalam sistem peradilan pidana, status ini menuntut pemenuhan hak-hak hukum
          tersangka, termasuk akses bantuan hukum dan perlindungan dari perlakuan
          sewenang-wenang. Penahanan merupakan fase kritis yang mempengaruhi kelanjutan
          proses investigasi dan peradilan.\n- 'Released': Menunjukkan bahwa tersangka
          telah dibebaskan, baik karena tidak cukup bukti, alasan hukum, atau pertimbangan
          kemanusiaan. Status ini penting dalam evaluasi efektivitas investigasi dan
          menjadi indikator penerapan asas praduga tak bersalah.\n- 'Wanted': Status
          ini berarti tersangka sedang dalam pencarian aktif oleh aparat penegak hukum.
          Penetapan status 'wanted' memerlukan koordinasi lintas lembaga, publikasi
          identitas, dan penggunaan sumber daya intelijen untuk penangkapan.\n- 'Under
          Investigation': Menandakan bahwa individu masih dalam proses penyelidikan
          dan status hukumnya belum final. Status ini menuntut kehati-hatian dalam
          publikasi data dan perlakuan terhadap individu, guna menjaga asas praduga
          tak bersalah dan integritas proses hukum.\n- 'Eyewitness': Status ini diberikan
          kepada individu yang berperan sebagai saksi mata dalam kasus. Saksi mata
          memiliki nilai probatif tinggi dalam pembuktian perkara, sehingga perlindungan
          dan penanganan profesional sangat diperlukan untuk menjaga keamanan dan
          keabsahan kesaksian."
