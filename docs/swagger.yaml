definitions:
  cases_request.Cases_Request:
    properties:
      case_description:
        type: string
      case_title:
        type: string
      detective_ids:
        items:
          type: string
        type: array
      incident_date:
        type: string
      location:
        type: string
      status:
        enum:
        - Open
        - In Progress
        - Closed
        type: string
    required:
    - status
    type: object
  detective_request.Detective_Request:
    properties:
      badge_number:
        type: string
      department:
        type: string
      investigation_style:
        enum:
        - Evidence-Based Investigation
        - Interview-Based Investigation
        - Undercover Investigation
        - Follow The Money Investigation
        - Report-Based Investigation
        type: string
      name:
        type: string
      phone:
        type: string
      station:
        type: string
    required:
    - investigation_style
    type: object
  suspects_request.Suspects_Request:
    properties:
      address:
        type: string
      alibi:
        type: string
      date_of_birth:
        type: string
      full_name:
        type: string
      gender:
        enum:
        - Male
        - Female
        type: string
      id_card_number:
        type: string
      occupation:
        type: string
      phone:
        type: string
      status:
        enum:
        - Arrested
        - Released
        - Wanted
        - Under Investigation
        - Eyewitness
        type: string
    required:
    - gender
    - status
    type: object
info:
  contact: {}
paths:
  /api/cases:
    get:
      description: 'Endpoint ini mengambil seluruh data kasus dengan dukungan paginasi
        dan pencarian judul. Cocok untuk monitoring dan analisis kasus. Asumsi: paginasi
        default 10 item/halaman.'
      parameters:
      - description: Nomor halaman, default 1
        in: query
        name: page
        type: integer
      - description: Jumlah item per halaman, default 10
        in: query
        name: limit
        type: integer
      - description: Pencarian berdasarkan judul kasus
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan daftar kasus beserta metadata paginasi
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Terjadi kesalahan sistem internal
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan seluruh data kasus
      tags:
      - Cases
  /api/cases/{id}:
    get:
      description: 'Endpoint ini mengambil data kasus spesifik berdasarkan UUID. Cocok
        untuk detail view atau proses investigasi lanjutan. Asumsi: ID valid dan eksis.'
      parameters:
      - description: UUID kasus yang dicari
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan data kasus
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Terjadi kesalahan sistem internal
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan kasus berdasarkan ID
      tags:
      - Cases
  /api/cases/count:
    get:
      description: 'Endpoint ini mengambil jumlah total kasus yang terdaftar dalam
        sistem. Cocok untuk statistik dan monitoring. Asumsi: data konsisten.'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan jumlah kasus
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Terjadi kesalahan sistem internal
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan jumlah kasus
      tags:
      - Cases
  /api/cases/create:
    post:
      consumes:
      - application/json
      description: 'Endpoint ini bertanggung jawab untuk pembuatan kasus baru, termasuk
        validasi, transformasi input, dan penanganan error. Proses ini krusial dalam
        workflow investigasi. Asumsi: data valid, judul unik per lokasi dan waktu.'
      parameters:
      - description: "Payload kasus dalam format JSON.\n\nField 'status' hanya dapat
          bernilai salah satu dari: \n- 'Open': Menandakan kasus baru dibuka dan seluruh
          proses investigasi masih dalam tahap inisiasi. Status ini merepresentasikan
          fase awal dalam siklus hidup kasus, di mana pengumpulan bukti dan identifikasi
          pihak terkait menjadi prioritas utama. \n- 'In Progress': Mengindikasikan
          bahwa kasus sedang dalam proses investigasi aktif. Pada tahap ini, seluruh
          sumber daya dialokasikan untuk analisis, pemeriksaan saksi, dan pengembangan
          hipotesis. Status ini menuntut adanya pembaruan berkala dan monitoring ketat
          terhadap perkembangan kasus. \n- 'Closed': Menunjukkan bahwa seluruh proses
          investigasi telah selesai, baik karena kasus telah terpecahkan, tidak ditemukan
          cukup bukti, atau alasan administratif lainnya. Status ini menandai berakhirnya
          siklus investigasi dan seluruh data kasus diarsipkan untuk keperluan audit
          dan pembelajaran institusional."
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cases_request.Cases_Request'
      produces:
      - application/json
      responses:
        "201":
          description: Kasus berhasil dibuat; response berisi data kasus baru
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Permintaan tidak valid; data input salah
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Terjadi kesalahan sistem internal
          schema:
            additionalProperties: true
            type: object
      summary: Membuat entitas kasus baru
      tags:
      - Cases
  /api/cases/delete/{id}:
    delete:
      description: 'Endpoint ini menghapus data kasus berdasarkan ID. Proses ini tidak
        dapat dibatalkan dan berdampak pada data terkait. Asumsi: ID valid dan eksis.'
      parameters:
      - description: UUID kasus yang akan dihapus
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil menghapus kasus
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Terjadi kesalahan sistem internal
          schema:
            additionalProperties: true
            type: object
      summary: Menghapus data kasus
      tags:
      - Cases
  /api/cases/latest:
    get:
      description: Endpoint ini mengambil seluruh data kasus dengan dukungan paginasi
